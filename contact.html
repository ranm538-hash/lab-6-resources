
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Trails, Water &amp; Sky</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <!-- The navbar toggler uses data-bs-target to open the drawer with id="site-menu". -->

    <nav class="navbar md:navbar-expand bg-1 fg-2" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Trails, Water &amp; Sky</a>
            <button class="btn-icon navbar-toggler" type="button"
            data-bs-toggle="drawer" data-bs-target="#site-menu"
            aria-controls="site-menu" aria-label="Open navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" id="site-menu" aria-labelledby="site-menu-title">
            <div class="drawer-header">
                <p class="drawer-title fw-bold" id="site-menu-title">Menu</p>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close navigation"></button>
            </div>
            <div class="drawer-body">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#gallery">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </dialog>
        </div>
    </nav>

    <main class="container my-4">
        <h1>Contact</h1>
        <p>Ask about a photo or suggest a place to photograph.</p>
        
        <!-- Use the same value for the label's for and the field's id. -->

        <form action="contact.html" method="get">
            <div class="row g-4">
                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label class="form-label" for="first name">First name</label>
                        <input class="form-control" type="text" id="first-name" required>
                    </div>
                 </div>
                 <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email" placeholder="name@example.com" required>
                    </div>
                 </div>
                 <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label class="form-label" for="topic">Topic</label>
                        <select class="form-control" id="topic" required>
                            <option value="">Choose a topic</option>
                            <option value="locations">Photo locations</option>
                            <option value="walks">Walking suggestions</option>
                            <option value="photography">Photography questions</option>
                            <option value="other">Other questions</option>
                        </select>
                    </div>
                 </div>
                 <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label class="form-label" for="message">Message</label>
                        <textarea class="form-control" id="message" rows="4" required></textarea>
                    </div>
                 </div>
                 <div class="col-12 md:col-6">
                    <div class="form-field">
                        <input type="checkbox" class="check" id="consent">
                        <label for="consent">I agree to be contacted about my message.</label>
                    </div>
                 </div>
            </div>
            <button class="btn-solid theme-primary mt-4" type="submit">Submit</button>
        </form>
    </main>

    <footer class="bg-primary fg-contrast-primary text-center p-3">
        <p class="mb-0">Trails, Water &amp; Sky · Original Photography</p>
    </footer>
</body>
</html>
